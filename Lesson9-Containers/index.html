<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Containers and Identity</title>
    <style>
        .highlight{
            background-color: bisque
        }
        #site-footer{
            color: blueviolet
        }
        .card{
            border:2px solid #94a3b8;
            border-radius: 8px
        }
        #main-nav{
            background-color:rgb(4, 4, 112);
            color:white
        }
        .price{
            color:rgb(74, 127, 24);
            font-weight:600
        }


    </style>
</head>

<body>
    <nav id="main-nav">...nav links...</nav>
    <p class="highlight">First Note</p>
    <p class="highlight">Second Note</p>
    <p class="highlight">Third Note</p>
    

    <!-- (div.card>h2+p)*2 -->
    <div class="card">
        <h2>Product A</h2>
        <p>First Product</p>
    </div>
    <div class="card">
        <h2>Product B</h2>
        <p>Second product</p>
    </div>

    <p>The price is <span class="price">$29</span> today only</p>

    <footer id="site-footer">
        @ 2026 CLUB SIGN-UP</footer>
        

</body>
</html>
