<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML forms</title>
</head>
<body>
    <h1>Club Sign-up</h1>
    <form action="display.html" method="GET">
        <label for="fullname" >Full Name:</label>
        <input type="text" id="fullname" name="fullname" value="Hannah Lee" required>
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder= "you@bergen.org" required>
        <br>
        <label for="age">Age:</label>
        <input type="number" id="age" name="age"  min=13 max=19 required>
         <br>
         <label for="startdate">Date you can start:</label>
         <input type="date" name="startdate" id="startdate">
         <br>
         <fieldset>
             <legend>Select Your Grade Level</legend>
             <label for="grade-9">Grade 9</label>
            <input type="radio" name="grade" id="grade-9" value="9">

            <label for="grade-10">Grade 10</label>
            <input type="radio" name="grade" id="grade-10" value="10">

            <label for="grade-11">Grade 11</label>
            <input type="radio" name="grade" id="grade-11" value="11">
            
            <label for="grade-12">Grade 12</label>
            <input type="radio" name="grade" id="grade-12" value="12">
            <br>
            <!-- <label for="period">Select Period</label> -->
            <select name="period" name="Period">
                <option value="" disabled selected>Select Period</option>
                <option value="1">Period 1</option>
                <option value="2">Period 2</option>
                <option value="3">Period 3</option>
            </select>
        </fieldset>
        <fieldset>
            <legend>Which days can you meet?</legend>
            <label for="mon">Monday</label>
            <input type="checkbox" name="days" id="mon">
            <label for="tues">Tuesday</label>
            <input type="checkbox" name="days" id="tues">
            <label for="wed">Wednesday</label>
            <input type="checkbox" name="days" id="wed">

        </fieldset>
        <label for="why">Why do you want to join?</label>
        <textarea name="why" id="why" rows="5"></textarea>
        <br>
        <button type="submit">Join the Club</button>
    </form>
</body>
</html>
