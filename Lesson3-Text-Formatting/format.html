<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatting</title>
</head>
<body>
    <p>Welcome to my site</p>
    <!-- control-slash for commenting -->
     <!-- p and then tab for bracket stuff -->
    <p>My name is Hannah</p>
    <h1>This is an h1 heading</h1>
    <!-- shift-alt-down to copy paste it next line -->
    <!-- <h2>This is an h2 heading</h2>
    <h3>This is an h3 heading</h3>
    <h4>This is an h4 heading</h4>
    <h5>This is an h5 heading</h5>
    <h6>This is an h6 heading</h6> -->
    <!-- anything past h7 will be normal text, 
     heading must be in increasing order, cannot jump around -->
     <h1>My personal website</h1>
     <h2>about me</h2>
     <h3>where i grew up</h3>

     <p>This is <b>bold</b> text.</p>
     <p>This is <strong>bold</strong> text.</p>
     <p>the word <i>ciao</i> is italian</p>
     <p>I <i>really</i> mean it</p>

     <!-- i is italic, b is bold, strong is strong and bold, em is emphasized -->

     <p> I want to <br> eat</p>
     <!-- br is a break and forces another paragraph- only need one 
      also multiple brs create multiple lines of break-->

     <p>
        P. sherman <br><br><br>
        42 Wallaby Wallaby <br>
        Sydney, Austrailia
        <hr>
        <!-- hr is a horizontal line -->
     </p>

     <p>This is <strong><em>extremely</em></strong> important</p>
     <!-- can do p>strong>em and then tab to do all three -->

</body>
</html>
